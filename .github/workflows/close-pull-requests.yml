# GitHub does not let a public repository turn pull requests off, and forking
# cannot be disabled on public repos either. This closes incoming pull requests
# automatically while the project is in beta and not yet taking contributions.
# Remove this workflow when pull requests are opened up.
#
# It deliberately does not check out the head ref, so nothing from the fork is
# ever executed here.
name: Close pull requests

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  close:
    # Only outside contributions. A pull request from a branch in this
    # repository is the maintainer's own, and closing those would make the
    # repository's normal workflow impossible.
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = [
              'Thanks for this — but the project is still in beta and is not accepting',
              'pull requests yet, so this is being closed automatically. That is about',
              'the state of the internals, which still change often, and not about your',
              'change.',
              '',
              'This is temporary. Contributions will be opened up once things settle;',
              'see [CONTRIBUTING.md](../blob/master/CONTRIBUTING.md).',
              '',
              'In the meantime bug reports are very welcome as issues, and you are free',
              'to carry this in a fork.',
            ].join('\n')
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body,
            })
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              state: 'closed',
            })
